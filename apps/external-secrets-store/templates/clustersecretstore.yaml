{{- /*
ClusterSecretStore backed by OCI Vault or AWS Secrets Manager.
Requires the External Secrets Operator (CRDs) installed outside this repo.
*/ -}}
{{- if eq .Values.provider "oci" }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.storeName }}
spec:
  provider:
    oracle:
      vault: {{ required "OCI_VAULT_OCID is required for EXTERNAL_SECRETS_PROVIDER=oci" .Values.ociVaultOcid | quote }}
      region: {{ required "OCI_VAULT_REGION is required for EXTERNAL_SECRETS_PROVIDER=oci" .Values.ociVaultRegion | quote }}
      auth:
        user: {{ required "OCI_VAULT_USER_OCID is required" .Values.ociUserOcid | quote }}
        tenancy: {{ required "OCI_VAULT_TENANCY_OCID is required" .Values.ociTenancyOcid | quote }}
        secretRef:
          privatekey:
            name: {{ .Values.ociAuthSecretName }}
            key: privateKey
          fingerprint:
            name: {{ .Values.ociAuthSecretName }}
            key: fingerprint
{{- else if eq .Values.provider "aws" }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.storeName }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "AWS_SECRETS_REGION (or AWS_REGION) is required for EXTERNAL_SECRETS_PROVIDER=aws" .Values.awsRegion | quote }}
{{- if eq .Values.awsAuthMethod "jwt" }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.awsServiceAccountName }}
            namespace: {{ .Values.awsServiceAccountNamespace }}
{{- else if eq .Values.awsAuthMethod "secretRef" }}
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: {{ .Values.awsAuthSecretName }}
            key: {{ .Values.awsAccessKeyIdKey }}
          secretAccessKeySecretRef:
            name: {{ .Values.awsAuthSecretName }}
            key: {{ .Values.awsSecretAccessKeyKey }}
{{- else }}
{{ fail (printf "EXTERNAL_SECRETS_AWS_AUTH must be secretRef or jwt (got %q)" .Values.awsAuthMethod) }}
{{- end }}
{{- else }}
{{ fail (printf "EXTERNAL_SECRETS_PROVIDER must be oci or aws (got %q)" .Values.provider) }}
{{- end }}
